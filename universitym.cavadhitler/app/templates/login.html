{% extends "base.html" %}
{% block title %}Giriş{% endblock %}
{% block page %}login{% endblock %}
{% block content %}
<form id="loginForm" class="card form narrow" novalidate>
  <h1>Giriş</h1>
  <label>E-poçt <input type="email" name="email" required></label>
  <label>Parol <input type="password" name="password" required></label>
  <div class="form-error" id="formError"></div>
  <button class="btn primary" type="submit">Daxil ol</button>
  <p>Hesabınız yoxdur? <a href="/register">Qeydiyyat</a></p>
</form>
{% endblock %}
